name: Anylinux-AppImages
# concurrency:
#   group: build-${{ github.ref }}
#   cancel-in-progress: true
on:
  #schedule:
  #  - cron: "0 7 1/21 * *" # We default to rebuilding every 21 days, change this to your liking
  push:
    branches:
      - main

  workflow_dispatch: {}

jobs:

  build-ubuntu1:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage (ubuntu1)
            arch: x86_64
    container: ubuntu:24.04
    steps:
      - name: Get repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Get the ubuntu1 scripts and nuke the rest
        run: |
          find scripts
          cp -va scripts/ubuntu1.* ./
          # rm -rf scripts
          chmod +x *.sh

      - name: Install Dependencies
        run: /bin/bash ./ubuntu1.get-dependencies.sh

      - name: Make AppImage
        run: /bin/bash ./ubuntu1.make-appimage.sh "${{ github.sha }}"

      - name: Show AppImage
        run: |
          ls -l dist
          echo "appinfo:"
          cat dist/appinfo

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: AppImage-ubuntu1-${{ matrix.arch }}
          path: dist

  build-alt1:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage (alt1,x86_64)
            arch: x86_64
          - runs-on: ubuntu-24.04-arm
            name: Build AppImage (alt1,aarch64)
            arch: aarch64
    container: alt:sisyphus
    steps:

      - name: Ensure these packages are installed
        run: |
          apt-get update
          apt-get install -yy glibc-pthread glibc-utils

      - name: Get repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Get the correct scripts and nuke the rest
        run: |
          find scripts
          cp -va scripts/alt1.* ./
          # rm -rf scripts
          chmod +x *.sh

      - name: Install Dependencies
        run: /bin/bash ./alt1.get-dependencies.sh

      - name: Make AppImage
        run: /bin/bash ./alt1.make-appimage.sh "${{ github.sha }}"

      - name: Show AppImage
        run: |
          ls -l dist
          echo "appinfo:"
          cat dist/appinfo

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: AppImage-alt1-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'main' }}

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true

    needs:
      - build-alt1
      - build-ubuntu1

    permissions: write-all
    runs-on: ubuntu-latest
    steps:

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: AppImage-*
          merge-multiple: true

      - name: Force specific version
        run: |
          VERSION_COL="$(date +%Y.%m.%d)"
          mv -v appinfo appinfo.original
          cat appinfo.original|grep -e "X-AppImage-Name=" -e "X-AppImage-Arch=" >> appinfo
          echo "X-AppImage-Version=$VERSION_COL" >> appinfo

      - name: Release AppImage
        # uses: carlos-a-g-h/make-stable-appimage-release@version-override
        uses: pkgforge-dev/make-stable-appimage-release@4ed3d48ccb065352b6e6c0db6d39885b201c54a0 #v1.1
